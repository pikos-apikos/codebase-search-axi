name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-tests:
    name: Public CLI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3 ripgrep
          python3 --version
          rg --version

      - name: Validate test script syntax
        run: bash -n tests/codebase-search.test.sh

      # This is also the local test entry point. It includes the Python
      # regression suite when that suite is present on the tested revision.
      - name: Run public CLI test suite
        run: bash tests/codebase-search.test.sh
