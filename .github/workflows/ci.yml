name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-tests:
    name: Public CLI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate test script syntax
        run: bash -n tests/codebase-search.test.sh

      # This is also the local test entry point: it builds the TypeScript CLI
      # and runs the Node test suite (CLI contract + rg fidelity regressions).
      - name: Run public CLI test suite
        run: bash tests/codebase-search.test.sh

      - name: Check generated skill
        run: npm run check:skill

      - name: Verify package install and opt-in integrations
        run: npm run package:check
